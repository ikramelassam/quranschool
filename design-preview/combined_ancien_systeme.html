<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Système combiné — validation finale</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --color-brand-gold-dark: #8B5A2B;
    --color-brand-emerald: #2D5A3D;
    --color-bg-cream: #F5EFE0;
    --color-text-primary: #1A1A1A;
    --color-text-muted: #6B6B6B;
    --color-success: #2D5A3D;
    --color-warning: #8B5A2B;
    --color-danger: #B3261E;

    --space-1: 4px; --space-2: 8px; --space-3: 16px;
    --space-4: 24px; --space-5: 32px; --space-6: 48px;

    --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem;
    --text-lg: 1.25rem; --text-xl: 1.75rem;

    --radius-sm: 8px;   /* badges, inputs, tags */
    --radius-lg: 12px;  /* boutons, cartes, modales */

    --badge-success-bg: #E3F2E7;
    --badge-warning-bg: #F7E8D4;
    --badge-danger-bg: #FBE4E1;

    --card-border: #E5DCC5;
}
* { box-sizing: border-box; }
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--color-bg-cream);
    margin: 0;
    padding: var(--space-5);
    color: var(--color-text-primary);
}
.page-title { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-1); }
.page-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-4); }
.header-row { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:var(--space-3); margin-bottom:var(--space-4); }

.btn {
    font-family:'Tajawal',sans-serif; font-size: var(--text-sm); font-weight:600;
    padding: var(--space-2) var(--space-4); border:none; cursor:pointer;
    border-radius: var(--radius-lg);
    display:inline-flex; align-items:center; gap:var(--space-1);
    text-decoration:none; transition: all 180ms ease;
}
.btn-primary { background: var(--color-brand-emerald); color:white; box-shadow:0 2px 8px rgba(45,90,61,0.25); }
.btn-primary:hover { transform: translateY(-1px); box-shadow:0 4px 14px rgba(45,90,61,0.35); background:#264d34; }
.btn-secondary { background: var(--badge-success-bg); color: var(--color-brand-emerald); box-shadow:none; }
.btn-secondary:hover { transform: translateY(-1px); background:#D3E8D9; }

.badge {
    font-size: var(--text-xs); font-weight:600; padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-sm); display:inline-flex; align-items:center; gap:4px;
}
.badge-success { background: var(--badge-success-bg); color: var(--color-success); }
.badge-warning { background: var(--badge-warning-bg); color: var(--color-warning); }
.badge-danger { background: var(--badge-danger-bg); color: var(--color-danger); }
.badge-urgent { background: var(--color-brand-gold-dark); color: white; }

.filter-bar {
    background:white; border:1px solid var(--card-border); border-radius: var(--radius-lg);
    padding: var(--space-4); margin-bottom: var(--space-4);
    display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:flex-end;
}
.filter-field { display:flex; flex-direction:column; gap:var(--space-1); }
.filter-field label { font-size: var(--text-xs); color: var(--color-text-muted); }
.filter-field select, .filter-field input {
    font-family:'Tajawal',sans-serif; font-size: var(--text-sm); padding: var(--space-2) var(--space-3);
    border:1px solid var(--card-border); border-radius: var(--radius-sm); background:white;
    transition: border-color 180ms ease;
}
.filter-field select:focus, .filter-field input:focus {
    outline:none; border-color: var(--color-brand-emerald);
    box-shadow: 0 0 0 3px rgba(45,90,61,0.12);
}

.grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: var(--space-3); }
.card {
    background:white; border:1px solid var(--card-border); border-radius: var(--radius-lg);
    padding: var(--space-4); transition: all 180ms ease;
}
.card:hover { border-color: var(--color-brand-emerald); box-shadow: 0 2px 10px rgba(45,90,61,0.08); }
.card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:var(--space-3); }
.card-title { font-size: var(--text-base); font-weight:700; }
.card-meta { font-size: var(--text-sm); color: var(--color-text-muted); display:flex; align-items:center; gap:6px; margin-bottom:var(--space-2); }
.card-footer { margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid #F0EBDD; }
</style>
</head>
<body>

<div class="header-row">
    <div>
        <div class="page-title">إدارة المجموعات</div>
        <div class="page-subtitle">إجمالي المجموعات: 3</div>
    </div>
    <button class="btn btn-primary">+ إنشاء مجموعة جديدة</button>
</div>

<div class="filter-bar">
    <div class="filter-field">
        <label>الحالة</label>
        <select><option>الكل</option></select>
    </div>
    <div class="filter-field">
        <label>المعلم</label>
        <select><option>الكل</option></select>
    </div>
    <div class="filter-field">
        <label>الحلقة</label>
        <select><option>الكل</option></select>
    </div>
    <button class="btn btn-secondary">تصفية</button>
</div>

<div class="grid">
    <div class="card">
        <div class="card-top">
            <span class="badge badge-warning">📅 مخططة</span>
        </div>
        <div class="card-title">groupe a</div>
        <div class="card-meta">👨‍🏫 mehdi l</div>
        <div class="card-meta">🕐 الاثنين 20:00 + الأربعاء 19:00</div>
        <div class="card-footer">
            <button class="btn btn-secondary" style="width:100%; justify-content:center;">عرض التفاصيل ←</button>
        </div>
    </div>
    <div class="card">
        <div class="card-top">
            <span class="badge badge-urgent">⚠️ لم يتم تقييمها بعد</span>
        </div>
        <div class="card-title">groupe b</div>
        <div class="card-meta">👨‍🏫 mehdi l</div>
        <div class="card-meta">🕐 الاثنين 16:00 + الخميس 14:00</div>
        <div class="card-footer">
            <button class="btn btn-secondary" style="width:100%; justify-content:center;">عرض التفاصيل ←</button>
        </div>
    </div>
    <div class="card">
        <div class="card-top">
            <span class="badge badge-danger">❌ ملغاة</span>
        </div>
        <div class="card-title">groupe c</div>
        <div class="card-meta">👨‍🏫 غير محدد</div>
        <div class="card-meta">🕐 الاثنين 15:00 + الثلاثاء 15:00</div>
        <div class="card-footer">
            <button class="btn btn-secondary" style="width:100%; justify-content:center;">عرض التفاصيل ←</button>
        </div>
    </div>
</div>

<div style="margin-top:var(--space-5); display:flex; gap:var(--space-2); flex-wrap:wrap;">
    <span class="badge badge-success">✅ منتهية</span>
    <span class="badge badge-warning">📅 مخططة</span>
    <span class="badge badge-danger">❌ ملغاة</span>
    <span class="badge badge-urgent">⚠️ لم يتم تقييمها بعد</span>
</div>

</body>
</html>
