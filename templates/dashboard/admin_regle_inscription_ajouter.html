{% extends base_template %}
{% block title %}إضافة قاعدة شرطية{% endblock %}
{% block content %}
<div class="page-title">إضافة قاعدة شرطية</div>
<div class="page-subtitle" style="margin-bottom:20px;">مثال: "إذا نوع الحصة يختلف عن جماعي → إخفاء مرحلة اختيار المجموعة"</div>

<div style="background:white; border-radius:16px; padding:32px; max-width:600px; box-shadow:0 2px 12px rgba(0,0,0,0.06);">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label style="font-weight:600; color:#333;">المعيار الشرطي *</label>
            <select name="critere_condition_id" id="critere_select" class="form-select mt-1" onchange="afficherOptions()" required>
                <option value="">— اختر —</option>
                {% for critere in criteres %}
                <option value="{{ critere.id }}">{{ critere.label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label style="font-weight:600; color:#333;">المشغّل *</label>
            <select name="operateur" class="form-select mt-1">
                <option value="egal">يساوي</option>
                <option value="different">يختلف عن</option>
                <option value="dans">ضمن</option>
            </select>
        </div>

        <div class="mb-3">
            <label style="font-weight:600; color:#333;">القيمة/القيم *</label>
            <div id="valeurs_container" style="color:#888; font-size:0.85rem;">اختر معياراً أولاً لعرض خياراته.</div>
        </div>

        <hr class="my-3">

        <div class="mb-3">
            <label style="font-weight:600; color:#333;">إخفاء *</label>
            <select name="cible_type" id="cible_type_select" class="form-select mt-1" onchange="toggleCible()">
                <option value="etape">مرحلة كاملة</option>
                <option value="champ">حقل واحد</option>
            </select>
        </div>
        <div class="mb-3" id="cible_etape_wrapper">
            <select name="cible_id" id="cible_etape_select" class="form-select mt-1">
                {% for etape in etapes %}
                <option value="{{ etape.id }}">{{ etape.titre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3" id="cible_champ_wrapper" style="display:none;">
            <select name="cible_id" id="cible_champ_select" class="form-select mt-1">
                {% for champ in champs %}
                <option value="{{ champ.id }}">{{ champ.etape.titre }} — {{ champ.label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button type="submit"
                style="background:var(--color-role-admin); color:white; border:none; border-radius:8px; padding:10px 24px; font-family:'Tajawal',sans-serif; font-size:1rem; cursor:pointer;">
                إضافة ✅
            </button>
            <a href="{% url 'admin_regles_inscription' %}" style="color:#888; text-decoration:none; padding:10px;">← رجوع</a>
        </div>
    </form>
</div>

<script>
    const OPTIONS_PAR_CRITERE = {
        {% for critere in criteres %}
        '{{ critere.id }}': [
            {% for option in critere.options.all %}
            {code: '{{ option.code }}', label: '{{ option.label|escapejs }}'},
            {% endfor %}
        ],
        {% endfor %}
    };

    function afficherOptions() {
        const critereId = document.getElementById('critere_select').value;
        const container = document.getElementById('valeurs_container');
        const options = OPTIONS_PAR_CRITERE[critereId] || [];
        if (!options.length) {
            container.innerHTML = 'لا توجد خيارات لهذا المعيار (أو معيار من نوع نصي — الفلترة الشرطية غير مدعومة بعد لهذا النوع).';
            return;
        }
        container.innerHTML = options.map(o => `
            <div class="form-check">
                <input type="checkbox" name="valeurs" value="${o.code}" class="form-check-input" id="val_${o.code}">
                <label class="form-check-label" for="val_${o.code}">${o.label}</label>
            </div>
        `).join('');
    }

    function toggleCible() {
        const type = document.getElementById('cible_type_select').value;
        document.getElementById('cible_etape_wrapper').style.display = type === 'etape' ? 'block' : 'none';
        document.getElementById('cible_champ_wrapper').style.display = type === 'champ' ? 'block' : 'none';
    }
    document.addEventListener('DOMContentLoaded', toggleCible);
</script>
{% endblock %}
