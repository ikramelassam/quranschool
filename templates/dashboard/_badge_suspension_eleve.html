{% load libelles_arabes %}
{% if eleve.statut == 'suspendu' %}
<span style="background:#fce4e4; color:#dc3545; border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:700; white-space:nowrap;">
    موقوف منذ {{ eleve.date_suspension|jours_depuis }} يوم
</span>
{% elif eleve.statut == 'archive' %}
<span style="background:#f0f0f0; color:#666; border-radius:20px; padding:2px 10px; font-size:0.75rem; font-weight:700; white-space:nowrap;">
    مؤرشف
</span>
{% endif %}
