{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ logo_url }}" type="{{ logo_mime_type }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور — منصة زدني علماً</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--color-bg-cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .site-title { color: var(--color-brand-gold-dark); font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .site-subtitle { color: #888; font-size: 0.9rem; text-align: center; margin-bottom: 28px; }
        .form-label { color: #333; font-weight: 500; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 10px 14px; font-family: 'Tajawal', sans-serif; text-align: right; }
        .btn-login {
            background: var(--gradient-cta-gold); color: var(--color-cta-gold-text); border: none;
            border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 700; width: 100%;
            margin-top: 8px; font-family: 'Tajawal', sans-serif; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="site-title">نسيت كلمة المرور ؟</div>
        <div class="site-subtitle">أدخل بريدك الإلكتروني، وستُشعَر الإدارة لتزويدك بكلمة مرور جديدة.</div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'mot_de_passe_oublie' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="أدخل بريدك الإلكتروني" required>
            </div>
            <button type="submit" class="btn-login">إرسال</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}" style="color:#888; font-size:0.88rem; text-decoration:none;">← رجوع لتسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
