{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ logo_url }}" type="{{ logo_mime_type }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل مغلق حالياً</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body {
            background-color: var(--color-bg-cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icone-fermeture {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--color-brand-gold-dark); color: var(--color-bg-cream);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin: 0 auto 20px;
        }
        .titre-fermeture {
            color: var(--color-text-primary); font-size: 1.25rem; font-weight: 700;
            margin-bottom: 8px;
        }
        .texte-excuse {
            color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 28px;
            line-height: 1.7;
        }
        .bloc-contact {
            background: var(--color-bg-cream); border-radius: 12px; padding: 12px 18px;
            text-align: start; margin-bottom: 24px;
        }
        .bloc-contact-titre {
            color: var(--color-brand-gold-dark); font-weight: 700; font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .btn-back {
            border: 2px solid #ddd;
            color: #888;
            background: white;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-back:hover { border-color: #aaa; color: #555; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="icone-fermeture">⏸️</div>
        <div class="titre-fermeture">التسجيل مغلق حالياً لفئة {{ categorie_label }}</div>
        <div class="texte-excuse">
            نعتذر، التسجيل في هذه الفئة متوقف مؤقتاً حالياً. يمكنكم التواصل مع الإدارة
            للاستفسار أو معرفة موعد إعادة الفتح.
        </div>

        <div class="bloc-contact">
            <div class="bloc-contact-titre">التواصل مع الإدارة</div>
            {% include 'dashboard/_contact_administration.html' with admins=admins %}
        </div>

        <a href="{% url 'login' %}" class="btn-back">رجوع ←</a>
    </div>
</body>
</html>
