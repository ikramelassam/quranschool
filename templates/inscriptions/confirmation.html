{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ar' }}" dir="{% if LANGUAGE_CODE and not LANGUAGE_BIDI %}ltr{% else %}rtl{% endif %}">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ logo_url }}" type="{{ logo_mime_type }}">
    {% if LANGUAGE_CODE and not LANGUAGE_BIDI %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    {% else %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    {% endif %}
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--color-bg-cream); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { border-radius: 16px; padding: 40px; text-align: center; max-width: 500px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        h2 { color: var(--color-success); font-weight: 700; }
    </style>
</head>
<body>
<div class="card bg-white">
    <div style="font-size:4rem">✅</div>
    <h2>{% trans "تم إرسال طلبك بنجاح!" %}</h2>
    <p class="text-muted mt-3">{% trans "سيتم التواصل معك قريباً بعد مراجعة طلبك من قِبَل الإدارة." %}</p>
    <a href="{% url 'login' %}" class="btn mt-4" style="background:var(--color-success); color:white; border-radius:8px; padding:10px 30px;">
        {% trans "العودة للرئيسية" %}
    </a>
</div>
</body>
</html>
